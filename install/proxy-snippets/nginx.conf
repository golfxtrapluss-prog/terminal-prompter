# nginx: WebSocket upgrade and unbuffered SSE are required (docs/06, docs/07).
server {
    listen 443 ssl;
    server_name tp.example.com;
    # ssl_certificate     /etc/letsencrypt/live/tp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tp.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;          # important for SSE
    }
}
