name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      TP_RELEASE_KEY: ${{ vars.TP_RELEASE_KEY }}
      TP_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      TP_RELEASE_SIGNING_KEY: ${{ secrets.TP_RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - run: make bootstrap
      - run: make test
      - run: make install-test
      - run: make release VERSION=${VERSION#v}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: TP_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/tp-agent:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/tp-agent:latest
