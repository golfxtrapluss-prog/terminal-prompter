name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - run: make bootstrap
      - run: make test

  build:
    name: Build binaries (x64 + arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0
      - run: make bootstrap
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: tp-agent
          path: bin/
